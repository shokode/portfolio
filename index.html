<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="refresh" content="0; url=https://shokode.github.io/">
    <title>Shoko's Portfolio — Site Moved</title>
    <link rel="stylesheet" href="./cardhover.css">
    <style>
        .moved-notice {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #fff;
            color: #111;
            font-family: sans-serif;
            text-align: center;
            z-index: 9999;
        }
        .moved-notice h1 { font-size: 1.5rem; margin-bottom: 1rem; }
        .moved-notice a {
            color: #0066cc;
            font-size: 1.1rem;
            word-break: break-all;
        }
        .moved-notice p { margin-top: 0.5rem; color: #555; font-size: 0.9rem; }
    </style>
</head>
<body>

<div class="moved-notice">
    <h1>This site has moved.</h1>
    <a href="https://shokode.github.io/">https://shokode.github.io/</a>
    <p>If you are not redirected automatically, click the link above.</p>
</div>

<button id="themeToggle" class="theme-toggle" type="button" aria-label="Toggle theme"></button>



  <div class="container">
    <div class="filters">
        <button class="filters-button" data-filter="All">All</button>
        <button class="filters-button" data-filter="Web">Web</button>
        <button class="filters-button" data-filter="UI/UX">UI/UX</button>
        <button class="filters-button" data-filter="Graphic">Graphic</button>
        <button class="filters-button" data-filter="Video">Video</button>
    </div>

    <div class="card__container" id="workGrid">


    </div>
  </div>

  <div id="pdf-modal" onclick="this.style.display='none'" style="display:none;position:fixed;inset:0;background:#000a;z-index:9999;padding:2rem">
    <button onclick="document.getElementById('pdf-modal').style.display='none'" style="position:absolute;top:1rem;right:1.5rem;font-size:1.5rem;background:none;border:none;color:white;cursor:pointer">✕</button>
    <iframe id="pdf-frame" style="width:100%;height:100%;border:none"></iframe>
  </div>
  <script>
    document.addEventListener('keydown', e => {
     if (e.key === 'Escape') document.getElementById('pdf-modal').style.display = 'none';
    });
  </script>

  <script src="./app.js"></script>
</body>

</html>
